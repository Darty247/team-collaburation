<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Currency Converter</title>
  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* 1. Background (Primary: #F8FAFC - Slate Light White) */
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #F8FAFC;
      padding: 20px;
    }

    /* 2. Card & Input Container (Secondary: #1E293B - Dark Slate Charcoal) */
    .card {
      background-color: #1E293B;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .card h2 {
      color: #F8FAFC;
      font-size: 1.4rem;
      text-align: center;
      margin-bottom: 8px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      color: #94A3B8;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      background-color: #0F172A;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #F8FAFC;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input:focus, select:focus {
      border-color: #10B981;
    }

    /* 3. Action & Accent (Highlight: #10B981 - Emerald Green) */
    #swapBtn {
      align-self: center;
      background: transparent;
      border: 1px solid #10B981;
      color: #10B981;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    #swapBtn:hover {
      background-color: #10B981;
      color: #1E293B;
    }

    #convertBtn {
      width: 100%;
      padding: 14px;
      background-color: #10B981;
      color: #1E293B;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    #convertBtn:hover {
      background-color: #059669;
    }

    #convertBtn:active, #swapBtn:active {
      transform: scale(0.97);
    }

    /* Final Output Text */
    #resultText {
      color: #10B981;
      font-size: 1.25rem;
      font-weight: 700;
      text-align: center;
      margin-top: 10px;
      min-height: 1.5em;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Currency Converter</h2>

    <div class="input-group">
      <label for="amount">Amount</label>
      <input type="number" id="amount" placeholder="Enter amount">
    </div>

    <div class="input-group">
      <label for="fromCurrency">From</label>
      <select id="fromCurrency">
        <option value="USD">USD - US Dollar</option>
        <option value="EUR">EUR - Euro</option>
        <option value="GBP">GBP - British Pound</option>
      </select>
    </div>

    <button id="swapBtn" type="button" title="Swap Currencies">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 16V4M7 4L3 8M7 4L11 8M17 8V20M17 20L21 16M17 20L13 16"/>
      </svg>
    </button>

    <div class="input-group">
      <label for="toCurrency">To</label>
      <select id="toCurrency">
        <option value="EUR">EUR - Euro</option>
        <option value="USD">USD - US Dollar</option>
        <option value="GBP">GBP - British Pound</option>
      </select>
    </div>

    <button id="convertBtn" type="button">Convert</button>

    <p id="resultText"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
